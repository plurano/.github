name: Bug report
description: Report a reproducible problem in a Plurano library or workflow.
body:
  - type: input
    id: versions
    attributes:
      label: Versions and environment
      description: Library or workflow version (or commit), language runtime and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: List the smallest steps that show the issue and what you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted diagnostics
      description: Include relevant errors or job logs. Remove credentials, tokens and private data.
    validations:
      required: true
