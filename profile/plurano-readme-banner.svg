<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Plurano: shared libraries and frameworks of one family">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="12" fill="url(#bg)"/>

  <!-- Small parts joined into one -->
  <g stroke-linecap="round" stroke-width="1.5">
    <line x1="736" y1="34" x2="910" y2="60" stroke="#06b6d4"/>
    <line x1="736" y1="86" x2="910" y2="60" stroke="#3b82f6"/>
    <line x1="830" y1="60" x2="910" y2="60" stroke="#8b5cf6"/>
    <line x1="950" y1="60" x2="1030" y2="60" stroke="#06b6d4"/>
    <line x1="950" y1="60" x2="1118" y2="34" stroke="#3b82f6"/>
    <line x1="950" y1="60" x2="1118" y2="86" stroke="#8b5cf6"/>
    <rect x="704" y="18" width="32" height="32" rx="6" fill="#111a35" stroke="#06b6d4"/>
    <rect x="704" y="70" width="32" height="32" rx="6" fill="#111a35" stroke="#3b82f6"/>
    <rect x="798" y="44" width="32" height="32" rx="6" fill="#111a35" stroke="#8b5cf6"/>
    <rect x="910" y="40" width="40" height="40" rx="6" fill="#111a35" stroke="url(#accent)"/>
    <rect x="1030" y="44" width="32" height="32" rx="6" fill="#111a35" stroke="#06b6d4"/>
    <rect x="1118" y="18" width="32" height="32" rx="6" fill="#111a35" stroke="#3b82f6"/>
    <rect x="1118" y="70" width="32" height="32" rx="6" fill="#111a35" stroke="#8b5cf6"/>
  </g>

  <text x="44" y="74" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#e2e8f0" letter-spacing="-1">Plurano</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#94a3b8">
    <text x="340" y="52">shared libraries · frameworks</text>
    <text x="340" y="76">Rust · Python · CI workflows</text>
  </g>
</svg>
